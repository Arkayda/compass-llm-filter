services:
  compass:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
    environment:
      COMPASS_UPSTREAM_BASE_URL: http://fake-llm:9000
      COMPASS_MODE: enforce            # попробуйте detect — трафик не тронется
      COMPASS_FAIL_MODE: closed
    depends_on:
      - fake-llm

  fake-llm:
    image: python:3.12-slim
    volumes:
      - ./fake_llm.py:/fake_llm.py:ro
    command: python /fake_llm.py
