[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "compass-llm-filter"
version = "0.1.0"
description = "Маскирование персональных данных в запросах к LLM и восстановление оригиналов в ответах. Библиотека и reverse-proxy для хелпдеска «Компас»."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Compass" }]
keywords = ["llm", "pii", "anonymization", "privacy", "proxy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Text Processing :: Filters",
]
dependencies = []

[project.optional-dependencies]
proxy = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.urls]
Homepage = "https://github.com/Arkayda/compass-llm-filter"

[project.scripts]
compass-llm-filter = "compass_llm_filter.proxy.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_llm_filter"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
